<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="ATLL - AhnTibody's Lifescience Lab">
  <title>ATLL | AhnTibody's Lifescience Lab</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17322b;
      --muted: #60736d;
      --line: #dce7e2;
      --paper: #f6faf8;
      --accent: #2f7663;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, "Noto Sans KR", system-ui, -apple-system, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 15% 20%, #e0f1e9 0, transparent 30%),
        radial-gradient(circle at 85% 80%, #e7efe9 0, transparent 28%),
        var(--paper);
    }
    main {
      width: min(760px, calc(100% - 40px));
      padding: 64px 48px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 24px 70px rgba(28, 65, 54, 0.10);
    }
    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent);
      font-size: 0.82rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 10vw, 6.7rem);
      line-height: 0.92;
      letter-spacing: -0.055em;
    }
    h2 {
      margin: 24px 0 0;
      font-size: clamp(1.15rem, 3vw, 1.65rem);
      font-weight: 620;
      letter-spacing: -0.025em;
    }
    p {
      max-width: 560px;
      margin: 28px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.75;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: 34px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 650;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 5px #e5f1ed;
    }
    @media (max-width: 560px) {
      main { padding: 48px 28px; border-radius: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Life Science Learning Portal</p>
    <h1>ATLL</h1>
    <h2>AhnTibody's Lifescience Lab</h2>
    <p>생명과학 수업에서 활용하는 탐구 활동과 인터랙티브 시뮬레이션을 하나씩 모아 가는 공간입니다.</p>
    <div class="status"><span class="dot" aria-hidden="true"></span>콘텐츠 준비 중</div>
  </main>
</body>
</html>
